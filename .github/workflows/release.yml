name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true
      notes:
        description: 'Release notes (Markdown, optional, auto-generated if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin sits at the repo root, matching every other extension in the
      # family (flattened 2026-08-30; it used to live in a sub-folder). Only the
      # files named below are copied, which keeps phpcs.xml and .github out of
      # what users install.
      - name: Build plugin zip
        run: |
          set -euo pipefail
          SLUG=better-search-for-hivepress
          mkdir -p "build/$SLUG"

          # Everything that ships is named here. Add any new top-level file or
          # folder to this list as well, or it is silently absent from the
          # release while every local test still passes. The warning is what
          # catches a rename, which is otherwise indistinguishable from a file
          # that was never meant to ship.
          for item in "$SLUG.php" updater.php uninstall.php readme.txt languages; do
            if [ -e "$item" ]; then
              cp -r "$item" "build/$SLUG/"
            else
              echo "warning: $item is absent from the repository" >&2
            fi
          done

          cd build
          zip -qr "$SLUG.zip" "$SLUG"

      - name: Create or refresh the release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
            fi
            gh release upload "$TAG" build/better-search-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -n "$NOTES" ]; then
            gh release create "$TAG" build/better-search-for-hivepress.zip --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/better-search-for-hivepress.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload asset to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/better-search-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
