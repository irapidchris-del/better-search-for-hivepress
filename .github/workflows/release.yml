name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true
      notes:
        description: 'Release notes (Markdown, optional, auto-generated if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin lives in a sub-folder of this repo, so the zip is built from
      # there rather than from the repo root. Only the plugin's own shipped files
      # are copied, which keeps phpcs.xml and .github out of what users install.
      - name: Build plugin zip
        run: |
          mkdir -p build/better-search-for-hivepress
          cd better-search-for-hivepress
          cp better-search-for-hivepress.php updater.php uninstall.php readme.txt ../build/better-search-for-hivepress/
          cp -r languages ../build/better-search-for-hivepress/
          cd ../build
          zip -r better-search-for-hivepress.zip better-search-for-hivepress

      - name: Create or refresh the release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
            fi
            gh release upload "$TAG" build/better-search-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -n "$NOTES" ]; then
            gh release create "$TAG" build/better-search-for-hivepress.zip --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/better-search-for-hivepress.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload asset to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/better-search-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
